<div class="card bg-dark text-white border-0 h-100">
  <div class="card__imagen position-relative" [style.backgroundImage]="'url(' + serie.image + ')'">
    <div class="card__overlay"></div>
    <span class="badge bg-danger position-absolute top-0 start-0 m-2">{{ serie.genre }}</span>
    <span class="badge bg-secondary position-absolute top-0 end-0 m-2">
      {{ serie.seasons }} temp.
    </span>
  </div>
  <div class="card-body d-flex flex-column gap-2">
    <div class="d-flex justify-content-between align-items-start">
      <h3 class="card-title fs-5 mb-0">{{ serie.title }}</h3>
      <span class="d-flex align-items-center gap-1 text-warning fw-bold small">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="#f59e0b">
          <polygon points="6.5,1 8.2,5 12.5,5.5 9.5,8.2 10.4,12.5 6.5,10.3 2.6,12.5 3.5,8.2 0.5,5.5 4.8,5"/>
        </svg>
        {{ serie.rating }}
      </span>
    </div>
    <span class="text-secondary small">{{ serie.year }} · {{ serie.seasons }} temporada{{ serie.seasons !== 1 ? 's' : '' }}</span>
    <p class="card-text text-white-50 small flex-grow-1">{{ serie.description }}</p>
    <div class="d-flex gap-2 mt-auto">
      <button class="btn btn-danger btn-sm d-flex align-items-center gap-1 flex-grow-1 justify-content-center"
        (click)="openTrailer()">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
          <polygon points="2,1 11,6 2,11"/>
        </svg>
        Ver tráiler
      </button>
      <button class="btn btn-outline-light btn-sm d-flex align-items-center gap-1 flex-grow-1 justify-content-center"
        (click)="goToDetail()">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="1" width="8" height="10" rx="1"/>
          <line x1="4" y1="4" x2="8" y2="4"/>
          <line x1="4" y1="6" x2="8" y2="6"/>
          <line x1="4" y1="8" x2="6" y2="8"/>
        </svg>
        Ver detalle
      </button>
    </div>
  </div>
</div>
