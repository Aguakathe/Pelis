<section
  class="hero"
  [style.backgroundImage]="getBackgroundStyle(activeMovie.image)"
  (mouseenter)="onHover(true)"
  (mouseleave)="onHover(false)">

  <div class="hero__overlay"></div>

  <!-- Flecha izquierda -->
  <button class="hero__arrow hero__arrow--prev" (click)="prev(); resetAutoplay()">
    <span class="arrow-icon">
      <span class="arrow-line"></span>
      <span class="arrow-head"></span>
    </span>
  </button>

  <!-- Flecha derecha -->
  <button class="hero__arrow hero__arrow--next" (click)="next(); resetAutoplay()">
    <span class="arrow-icon">
      <span class="arrow-line"></span>
      <span class="arrow-head"></span>
    </span>
  </button>

  <div class="hero__content">

    <div class="hero__body" [class.hero__body--out]="isAnimating">
      <span class="hero__eyebrow">— {{ activeMovie.label }}</span>
      <h1 class="hero__title">{{ activeMovie.title }}</h1>
      <p class="hero__description">{{ activeMovie.description }}</p>

      <div class="hero__actions">
        <button class="btn btn--primary" (click)="openTrailer()">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
            <polygon points="3,1 13,7 3,13"/>
          </svg>
          Ver tráiler
        </button>
        <button class="btn btn--secondary">
          Leer resumen
        </button>
      </div>
    </div>

    <footer class="hero__footer">
      <div class="hero__meta">
        <div class="hero__meta-item">
          <span class="hero__meta-label">Destacado</span>
          <span class="hero__meta-value">{{ activeMovie.title }}</span>
        </div>
        <div class="hero__meta-item">
          <span class="hero__meta-label">Duración</span>
          <span class="hero__meta-value">{{ activeMovie.duration }}</span>
        </div>
        <div class="hero__meta-item">
          <span class="hero__meta-label">Calificación</span>
          <span class="hero__meta-value">★ {{ activeMovie.rating }}</span>
        </div>
      </div>

      <div class="hero__dots">
        <button
          *ngFor="let movie of movies; let i = index"
          class="hero__dot"
          [class.hero__dot--active]="i === currentIndex"
          (click)="goTo(i)">
        </button>
      </div>
    </footer>

  </div>
</section>

<!-- Popup tráiler -->
<div class="trailer-backdrop" *ngIf="showTrailer" (click)="closeTrailer()">
  <div class="trailer-modal" (click)="$event.stopPropagation()">
    <button class="trailer-close" (click)="closeTrailer()">✕</button>
    <iframe
      [src]="safeTrailerUrl"
      frameborder="0"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>
</div>
